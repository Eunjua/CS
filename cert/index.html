<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>교육 이수증 발급 — 케어파트너아카데미</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ── 기본 레이아웃 ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: #f0f2f5;
    min-height: 100vh;
    padding: 40px 20px;
    color: #222;
  }

  .page-wrap {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 32px;
    align-items: start;
  }

  /* ── 입력 폼 ── */
  .form-panel {
    background: #fff;
    border-radius: 16px;
    padding: 32px 28px;
    box-shadow: 0 2px 16px rgba(0,0,0,.08);
    position: sticky;
    top: 40px;
  }

  .form-panel h2 {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 24px;
    color: #1a1a2e;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .form-panel h2::before {
    content: '';
    display: block;
    width: 4px;
    height: 20px;
    background: #3b7dd8;
    border-radius: 2px;
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: #555;
    margin-bottom: 6px;
    margin-top: 18px;
  }

  label:first-of-type { margin-top: 0; }

  input[type="text"], input[type="date"] {
    width: 100%;
    padding: 10px 14px;
    border: 1.5px solid #dde1e7;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    color: #222;
    transition: border-color .2s;
    outline: none;
  }

  input:focus {
    border-color: #3b7dd8;
    box-shadow: 0 0 0 3px rgba(59,125,216,.12);
  }

  .hint {
    font-size: 11px;
    color: #999;
    margin-top: 4px;
  }

  .btn-print {
    margin-top: 28px;
    width: 100%;
    padding: 13px;
    background: #3b7dd8;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: background .2s, transform .1s;
  }

  .btn-print:hover { background: #2e67be; }
  .btn-print:active { transform: scale(.98); }

  /* ── 이수증 미리보기 ── */
  .preview-wrap {
    background: #fff;
    border-radius: 16px;
    padding: 40px;
    box-shadow: 0 2px 16px rgba(0,0,0,.08);
  }

  .preview-label {
    font-size: 12px;
    color: #aaa;
    text-transform: uppercase;
    letter-spacing: .08em;
    margin-bottom: 20px;
  }

  /* ── 이수증 본문 ── */
  .cert {
    font-family: 'Noto Serif KR', serif;
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
    padding: 60px 56px;
    border: 1px solid #e0e0e0;
    min-height: 800px;
    position: relative;
  }

  .cert-title {
    text-align: center;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: .35em;
    margin-bottom: 36px;
    color: #1a1a2e;
  }

  .cert-divider {
    border: none;
    border-top: 1.5px solid #333;
    margin: 0 0 28px 0;
  }

  .cert-section-title {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 18px;
    color: #1a1a2e;
  }

  .cert-row {
    font-size: 13px;
    line-height: 2.2;
    padding-left: 12px;
    color: #222;
  }

  .cert-row span.field {
    display: inline-block;
    width: 120px;
    text-align: justify;
    text-align-last: justify;
  }

  .cert-row span.value {
    font-weight: 500;
  }

  .cert-confirm {
    text-align: center;
    font-size: 14px;
    margin-top: 80px;
    margin-bottom: 36px;
    color: #333;
    line-height: 1.8;
  }

  .cert-footer {
    text-align: center;
  }

  .cert-issue-date {
    font-size: 13px;
    color: #444;
    margin-bottom: 20px;
    letter-spacing: .06em;
  }

  .cert-org-wrap {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    position: relative;
  }

  .cert-org {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: .35em;
    color: #1a1a2e;
  }

  .cert-stamp {
    width: 60px;
    height: 60px;
    object-fit: contain;
    margin-left: -8px;
    margin-top: -10px;
  }

  /* ── 인쇄 스타일 ── */
  @media print {
    @page {
      size: A4;
      margin: 0;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #fff;
    }

    .page-wrap, .form-panel, .preview-wrap, .preview-label {
      all: unset;
      display: block;
    }

    .form-panel { display: none !important; }
    .preview-wrap {
      display: block;
      padding: 0;
      box-shadow: none;
    }

    .cert {
      width: 210mm;
      min-height: 297mm;
      padding: 25mm 22mm;
      border: none;
      margin: 0;
      max-width: 100%;
    }

    .cert-title { font-size: 32px; }
    .cert-section-title { font-size: 15px; }
    .cert-row { font-size: 14px; }
    .cert-confirm { font-size: 15px; margin-top: 100px; }
    .cert-issue-date { font-size: 14px; }
    .cert-org { font-size: 17px; }
    .cert-stamp { width: 70px; height: 70px; }

    .btn-print { display: none !important; }
  }
</style>
</head>
<body>

<div class="page-wrap">

  <!-- 입력 폼 -->
  <aside class="form-panel">
    <h2>이수증 정보 입력</h2>

    <label for="inp-name">수강자 이름</label>
    <input type="text" id="inp-name" placeholder="홍길동" oninput="render()">

    <label for="inp-birth">생년월일</label>
    <input type="text" id="inp-birth" placeholder="19961019" maxlength="8" oninput="render()">
    <p class="hint">8자리 입력 (예: 19961019 → 1996년 10월 19일)</p>

    <label for="inp-course">과정명</label>
    <input type="text" id="inp-course" placeholder="예: 요양보호사 직무교육" oninput="render()">

    <label for="inp-end">수강 만료일</label>
    <input type="date" id="inp-end" oninput="render()">
    <p class="hint">시작일은 만료일 기준 2주 전으로 자동 계산됩니다.</p>

    <button class="btn-print" onclick="window.print()">🖨 PDF로 저장 / 인쇄</button>
  </aside>

  <!-- 미리보기 -->
  <main class="preview-wrap">
    <div class="preview-label">미리보기 — 입력값이 바로 반영됩니다</div>
    <div class="cert" id="cert">

      <div class="cert-title">교 육 이 수 증</div>
      <hr class="cert-divider">

      <div class="cert-section-title">■ 수강자 정보</div>
      <div class="cert-row">
        <span class="field">성 명</span>
        <span> : </span>
        <span class="value" id="out-name">—</span>
      </div>
      <div class="cert-row">
        <span class="field">생 년 월 일</span>
        <span> : </span>
        <span class="value" id="out-birth">—</span>
      </div>

      <hr class="cert-divider" style="margin-top:24px;">

      <div class="cert-section-title">■ 과정 정보</div>
      <div class="cert-row">
        <span class="field">과 정 명</span>
        <span> : </span>
        <span class="value" id="out-course">—</span>
      </div>
      <div class="cert-row">
        <span class="field">수 강 기 간</span>
        <span> : </span>
        <span class="value" id="out-period">—</span>
      </div>

      <hr class="cert-divider" style="margin-top:24px;">

      <div class="cert-confirm">
        위 사람은 상기 교육 과정을 이수하였음을 확인합니다.
      </div>

      <div class="cert-footer">
        <div class="cert-issue-date" id="out-issue-date"></div>
        <div class="cert-org-wrap">
          <span class="cert-org">케 어 파 트 너 아 카 데 미</span>

<script>
  function fmtBirth(raw) {
    if (!raw || raw.length < 8) return '—';
    const yyyy = raw.slice(0, 4);
    const mm = raw.slice(4, 6);
    const dd = raw.slice(6, 8);
    return `${yyyy}년 ${mm}월 ${dd}일`;
  }

  function fmt(dateStr) {
    if (!dateStr) return '—';
    const [y, m, d] = dateStr.split('-');
    return `${y}년 ${m}월 ${d}일`;
  }

  function addWeeks(dateStr, weeks) {
    const d = new Date(dateStr);
    d.setDate(d.getDate() + weeks * 7);
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  function todayStr() {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, '0');
    const d = String(now.getDate()).padStart(2, '0');
    return `${y}년 ${m}월 ${d}일`;
  }

  function render() {
    const name   = document.getElementById('inp-name').value.trim();
    const birthRaw = document.getElementById('inp-birth').value.trim();
    const course = document.getElementById('inp-course').value.trim();
    const end    = document.getElementById('inp-end').value;

    document.getElementById('out-name').textContent   = name   || '—';
    document.getElementById('out-birth').textContent  = fmtBirth(birthRaw);
    document.getElementById('out-course').textContent = course || '—';

    if (end) {
      const start = addWeeks(end, -2);
      document.getElementById('out-period').textContent = `${fmt(start)} ~ ${fmt(end)}`;
    } else {
      document.getElementById('out-period').textContent = '—';
    }

    document.getElementById('out-issue-date').textContent = todayStr();
  }

  // 초기 날짜 렌더링
  render();
</script>
