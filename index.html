<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>VOC 상담 분석 대시보드</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f4f4f4;
        }
        .file-upload {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .chart-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        canvas {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 10px;
        }
        h2 {
            text-align: center;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="file-upload">
        <h2>VOC 상담 분석 대시보드</h2>
        <input type="file" id="upload" accept=".xlsx" multiple>
    </div>
    <div class="chart-container">
        <canvas id="mediumTypeChart"></canvas>
        <canvas id="weeklyTrendChart"></canvas>
        <canvas id="mainCategoryChart"></canvas>
        <canvas id="weeklyMainCategoryTrendChart"></canvas>
        <canvas id="middleCategoryChart"></canvas>
        <canvas id="weeklyMiddleCategoryTrendChart"></canvas>
        <canvas id="subCategoryChart"></canvas>
        <canvas id="weeklySubCategoryTrendChart"></canvas>
    </div>

    <script>
        function getWeekNumber(date) {
            const firstDayOfYear = new Date(date.getFullYear(), 0, 1);
            const pastDaysOfYear = (date - firstDayOfYear) / 86400000;
            return Math.ceil((pastDaysOfYear + firstDayOfYear.getDay() + 1) / 7);
        }

        function getWeekStartDate(date) {
            const day = date.getDay();
            const diff = date.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(date.setDate(diff));
        }

        document.getElementById('upload').addEventListener('change', handleFiles);

        function parseTagCategories(tags) {
            if (!tags || typeof tags !== 'string') return null;
            
            const parts = tags.split('/');
            const mainCategory = parts[0].split('_')[0];
            const middleCategory = parts[0].split('_')[1];
            const subCategory = parts[1] || null;

            return {
                mainCategory,
                middleCategory,
                subCategory
            };
        }

        function handleFiles(e) {
            const files = e.target.files;
            let allParsedData = [];

            const filePromises = Array.from(files).map(file => {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, {type: 'array'});
                        
                        const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                        const jsonData = XLSX.utils.sheet_to_json(worksheet);

                        const parsedData = jsonData.map(row => ({
                            ...row,
                            parsedDate: new Date(row['firstAskedAt'] || row['createdAt'])
                        }));

                        resolve(parsedData);
                    };
                    reader.readAsArrayBuffer(file);
                });
            });

            Promise.all(filePromises).then(resultArrays => {
                const allParsedData = resultArrays.flat();

                const mediumTypeCounts = analyzeMediumTypes(allParsedData);
                const weeklyTrend = analyzeWeeklyTrend(allParsedData);
                const { categoryCounts, weeklyCategories } = analyzeTagCategories(allParsedData);

                createMediumTypeChart(mediumTypeCounts);
                createWeeklyTrendChart(weeklyTrend);

                createCategoryChart(categoryCounts, 'mainCategory');
                createWeeklyTagTrendChart(weeklyCategories, 'mainCategory');

                createCategoryChart(categoryCounts, 'middleCategory');
                createWeeklyTagTrendChart(weeklyCategories, 'middleCategory');

                createCategoryChart(categoryCounts, 'subCategory');
                createWeeklyTagTrendChart(weeklyCategories, 'subCategory');
            });
        }

        function analyzeMediumTypes(data) {
            const counts = {};
            data.forEach(row => {
                const mediumType = row['mediumType'] === 'native' ? 'app' : (row['mediumType'] || '기타');
                counts[mediumType] = (counts[mediumType] || 0) + 1;
            });
            return counts;
        }

        function analyzeWeeklyTrend(data) {
            const weeklyData = {};
            
            data.forEach(row => {
                const askedDate = new Date(row['firstAskedAt']);
                const weekStart = getWeekStartDate(askedDate);
                const weekKey = weekStart.toISOString().split('T')[0];
                
                const mediumType = row['mediumType'] === 'native' ? 'app' : (row['mediumType'] || '기타');

                if (!weeklyData[weekKey]) {
                    weeklyData[weekKey] = {};
                }
                
                weeklyData[weekKey][mediumType] = 
                    (weeklyData[weekKey][mediumType] || 0) + 1;
            });

            return weeklyData;
        }

        function analyzeTagCategories(data) {
            const categoryCounts = {
                mainCategory: {},
                middleCategory: {},
                subCategory: {}
            };

            const weeklyCategories = {};

            const allowedMainCategories = ['요', '기관', '아카데미'];

            data.forEach(row => {
                const askedDate = new Date(row['firstAskedAt']);
                const weekStart = getWeekStartDate(askedDate);
                const weekKey = weekStart.toISOString().split('T')[0];
                const tagCategories = parseTagCategories(row['tags']);

                if (tagCategories && allowedMainCategories.includes(tagCategories.mainCategory)) {
                    ['mainCategory', 'middleCategory', 'subCategory'].forEach(level => {
                        const category = tagCategories[level];
                        if (category) {
                            categoryCounts[level][category] = 
                                (categoryCounts[level][category] || 0) + 1;
                        }
                    });

                    if (!weeklyCategories[weekKey]) {
                        weeklyCategories[weekKey] = {
                            mainCategory: {},
                            middleCategory: {},
                            subCategory: {}
                        };
                    }

                    ['mainCategory', 'middleCategory', 'subCategory'].forEach(level => {
                        const category = tagCategories[level];
                        if (category) {
                            weeklyCategories[weekKey][level][category] = 
                                (weeklyCategories[weekKey][level][category] || 0) + 1;
                        }
                    });
                }
            });

            return { categoryCounts, weeklyCategories };
        }

        function createMediumTypeChart(mediumTypeCounts) {
            const ctx = document.getElementById('mediumTypeChart').getContext('2d');
            
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: Object.keys(mediumTypeCounts),
                    datasets: [{
                        label: '매체별 상담 건수',
                        data: Object.values(mediumTypeCounts),
                        backgroundColor: [
                            'rgba(255, 99, 132, 0.6)',
                            'rgba(54, 162, 235, 0.6)',
                            'rgba(255, 206, 86, 0.6)',
                            'rgba(75, 192, 192, 0.6)'
                        ]
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        title: {
                            display: true,
                            text: '매체별 상담 건수'
                        }
                    }
                }
            });
        }

        function createWeeklyTrendChart(weeklyData) {
            const ctx = document.getElementById('weeklyTrendChart').getContext('2d');
            
            // 날짜 오름차순 정렬
            const sortedWeeks = Object.keys(weeklyData).sort();
            
            const mediumTypes = [...new Set(Object.values(weeklyData).flatMap(Object.keys))];
            
            const datasets = mediumTypes.map((mediumType, index) => ({
                label: mediumType,
                data: sortedWeeks.map(week => weeklyData[week][mediumType] || 0),
                borderColor: [
                    'rgba(255, 99, 132, 1)',
                    'rgba(54, 162, 235, 1)',
                    'rgba(255, 206, 86, 1)',
                    'rgba(75, 192, 192, 1)'
                ][index % 4],
                fill: false
            }));

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: sortedWeeks,
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    plugins: {
                        title: {
                            display: true,
                            text: '주차별 매체 트렌드'
                        }
                    }
                }
            });
        }

        function createCategoryChart(categoryCounts, level = 'mainCategory') {
            const ctx = document.getElementById(`${level}Chart`).getContext('2d');
            
            const sortedCategories = Object.entries(categoryCounts[level])
                .sort((a, b) => b[1] - a[1])
                .slice(0, 10);

            const labels = sortedCategories.map(([category]) => category);
            const counts = sortedCategories.map(([, count]) => count);

            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: `${level} 상담 건수 (Top 10)`,
                        data: counts,
                        backgroundColor: 'rgba(75, 192, 192, 0.6)'
                    }]
                },
                options: {
                    responsive: true,
                    indexAxis: 'y',
                    plugins: {
                        title: {
                            display: true,
                            text: `${level} 상담 건수`
                        }
                    },
                    scales: {
                        x: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }

        function createWeeklyTagTrendChart(weeklyCategories, level = 'mainCategory') {
            const ctx = document.getElementById(`weekly${level}TrendChart`).getContext('2d');
            
            // 날짜 오름차순 정렬
            const sortedWeeks = Object.keys(weeklyCategories).sort();
            
            const categories = [...new Set(
                Object.values(weeklyCategories)
                    .flatMap(weekData => Object.keys(weekData[level]))
            )];
            
            const datasets = categories.map((category, index) => ({
                label: category,
                data: sortedWeeks.map(
                    week => weeklyCategories[week][level][category] || 0
                ),
                borderColor: [
                    'rgba(255, 99, 132, 1)',
                    'rgba(54, 162, 235, 1)',
                    'rgba(255, 206, 86, 1)',
                    'rgba(75, 192, 192, 1)'
                ][index % 4],
                fill: false
            }));

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: sortedWeeks,
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    plugins: {
                        title: {
                            display: true,
                            text: `주차별 ${level} 트렌드`
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
