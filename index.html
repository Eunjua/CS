<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주문번호 생성기</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }
        
        select, input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s;
        }
        
        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .result-section {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            display: none;
        }
        
        .result-section.show {
            display: block;
        }
        
        .result-label {
            color: #666;
            font-size: 13px;
            margin-bottom: 8px;
            font-weight: 600;
        }
        
        .result-box {
            background: white;
            padding: 15px;
            padding-bottom: 50px;
            border-radius: 8px;
            border: 2px solid #e0e0e0;
            word-break: break-all;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            color: #333;
            position: relative;
        }
        
        .copy-btn {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 10px;
            padding: 8px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
            width: calc(100% - 20px);
        }
        
        .copy-btn:hover {
            background: #5568d3;
            transform: translateX(-50%);
        }
        
        .copy-btn.copied {
            background: #28a745;
            transform: translateX(-50%);
        }
        
        .history-section {
            margin-top: 30px;
        }
        
        .history-title {
            color: #333;
            font-size: 18px;
            margin-bottom: 15px;
            font-weight: 600;
        }
        
        .history-list {
            max-height: 300px;
            overflow-y: auto;
        }
        
        .history-item {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 13px;
            position: relative;
            padding-right: 80px;
        }
        
        .history-item .time {
            color: #999;
            font-size: 11px;
            display: block;
            margin-bottom: 5px;
        }
        
        .history-item .order-id {
            color: #333;
            font-family: 'Courier New', monospace;
            word-break: break-all;
        }
        
        .clear-history {
            width: auto;
            padding: 8px 15px;
            font-size: 13px;
            background: #dc3545;
            margin-top: 10px;
            position: relative;
            z-index: 10;
            cursor: pointer;
        }
        
        .clear-history:hover {
            background: #c82333;
            transform: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎫 주문번호 생성기</h1>
        
        <div class="form-group">
            <label for="certification">자격증 선택</label>
            <select id="certification">
                <option value="">자격증을 선택하세요</option>
                <option value="31">정원관리사 (ID: 31)</option>
                <option value="10">실버보드게임지도사 (ID: 10)</option>
                <option value="21">학교안전지도사 (ID: 21)</option>
                <option value="20">펫시터 (ID: 20)</option>
                <option value="17">타로심리상담사 (ID: 17)</option>
                <option value="16">정리수납전문가 (ID: 16)</option>
                <option value="12">심리상담사 (ID: 12)</option>
                <option value="3">실버인지활동지도사 (ID: 3)</option>
                <option value="1">병원동행매니저 (ID: 1)</option>
                <option value="8">베이비시터 (ID: 8)</option>
                <option value="7">바리스타 (ID: 7)</option>
                <option value="13">명리심리상담사 (ID: 13)</option>
                <option value="5">노인심리상담사 (ID: 5)</option>
                <option value="2">노인돌봄생활지원사 (ID: 2)</option>
                <option value="23">도시농업전문가 (ID: 23)</option>
                <option value="19">방과후학교지도사 (ID: 19)</option>
                <option value="32">탐정사 (ID: 32)</option>
                <option value="27">아동심리상담사 (ID: 27)</option>
                <option value="33">청소관리사 (ID: 33)</option>
                <option value="26">아동교육지도사 (ID: 26)</option>
                <option value="9">병원코디네이터 (ID: 9)</option>
                <option value="34">유품정리사 (ID: 34)</option>
                <option value="35">은퇴설계전문가 (ID: 35)</option>
                <option value="4">가족심리상담사 (ID: 4)</option>
                <option value="6">미술심리상담지도사 (ID: 6)</option>
                <option value="11">심리분석사 (ID: 11)</option>
                <option value="18">데이터라벨러 (ID: 18)</option>
                <option value="15">웰에이징지도사 (ID: 15)</option>
                <option value="14">웰다잉지도사 (ID: 14)</option>
                <option value="29">일상돌봄매니저 (ID: 29)</option>
                <option value="28">시니어웰니스전문가 (ID: 28)</option>
                <option value="30">주거안심매니저 (ID: 30)</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="userId">유저 Public ID</label>
            <input type="text" id="userId" placeholder="예: jrkn79ihyp">
        </div>
        
        <button onclick="generateOrderNumber()">주문번호 생성</button>
        
        <div class="result-section" id="resultSection">
            <div class="result-label">결제 금액</div>
            <div class="result-box" style="padding-bottom: 15px; margin-bottom: 15px;">
                <span id="paymentAmount" style="font-weight: bold; color: #667eea; font-size: 18px;"></span>
            </div>
            
            <div class="result-label">상품</div>
            <div class="result-box" style="padding-bottom: 15px; margin-bottom: 15px;">
                <span id="buyerName"></span>
            </div>
            
            <div class="result-label">생성된 주문번호</div>
            <div class="result-box" id="resultBox">
                <span id="orderNumber"></span>
                <button class="copy-btn" onclick="copyToClipboard()">복사</button>
            </div>
        </div>
        
        <div class="history-section">
            <div class="history-title">생성 기록</div>
            <div class="history-list" id="historyList"></div>
            <button class="clear-history" id="clearHistoryBtn">기록 삭제</button>
        </div>
    </div>
    
    <script>
        // ULID 생성 함수 (26자리 랜덤 문자열)
        function generateULID() {
            const ENCODING = '0123456789ABCDEFGHJKMNPQRSTVWXYZ'; // Crockford's Base32
            const ENCODING_LEN = ENCODING.length;
            const TIME_LEN = 10;
            const RANDOM_LEN = 16;
            
            let ulid = '';
            
            // 타임스탬프 부분 (10자리)
            const now = Date.now();
            let time = now;
            for (let i = TIME_LEN - 1; i >= 0; i--) {
                ulid = ENCODING.charAt(time % ENCODING_LEN) + ulid;
                time = Math.floor(time / ENCODING_LEN);
            }
            
            // 랜덤 부분 (16자리)
            for (let i = 0; i < RANDOM_LEN; i++) {
                ulid += ENCODING.charAt(Math.floor(Math.random() * ENCODING_LEN));
            }
            
            return ulid;
        }
        
        function generateOrderNumber() {
            const certificationId = document.getElementById('certification').value;
            const userId = document.getElementById('userId').value.trim();
            
            if (!certificationId) {
                alert('자격증을 선택해주세요.');
                return;
            }
            
            if (!userId) {
                alert('유저 Public ID를 입력해주세요.');
                return;
            }
            
            // 숫자만 입력된 경우 차단
            if (/^\d+$/.test(userId)) {
                alert('유저 Public ID는 숫자만으로 구성될 수 없습니다.\n영문자를 포함해주세요.');
                return;
            }
            
            const ulid = generateULID();
            const orderNumber = `${ulid}-certification-${certificationId}-${userId}`;
            
            // 상품명 생성
            const certificationSelect = document.getElementById('certification');
            const certificationText = certificationSelect.options[certificationSelect.selectedIndex].text;
            const certificationName = certificationText.split('(ID:')[0].trim();
            
            let buyerName;
            let paymentAmount;
            if (certificationId === '8') {
                buyerName = '자격증-베이비시터(상장)';
                paymentAmount = '83,000';
            } else {
                buyerName = `자격증-${certificationName}(상장+카드)`;
                paymentAmount = '93,000';
            }
            
            document.getElementById('orderNumber').textContent = orderNumber;
            document.getElementById('buyerName').textContent = buyerName;
            document.getElementById('paymentAmount').textContent = paymentAmount;
            document.getElementById('resultSection').classList.add('show');
            
            // 기록에 추가
            addToHistory(orderNumber, certificationId, userId, buyerName, paymentAmount);
        }
        
        function copyToClipboard() {
            const orderNumber = document.getElementById('orderNumber').textContent;
            const btn = event.target;
            
            navigator.clipboard.writeText(orderNumber).then(() => {
                const originalText = btn.textContent;
                btn.textContent = '복사완료!';
                btn.classList.add('copied');
                
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.classList.remove('copied');
                }, 2000);
            }).catch(err => {
                alert('복사에 실패했습니다.');
            });
        }
        
        function addToHistory(orderNumber, certId, userId, buyerName, paymentAmount) {
            const history = getHistory();
            const timestamp = new Date().toLocaleString('ko-KR');
            
            history.unshift({
                orderNumber,
                certId,
                userId,
                buyerName,
                paymentAmount,
                timestamp
            });
            
            // 최대 20개까지만 저장
            if (history.length > 20) {
                history.pop();
            }
            
            localStorage.setItem('orderHistory', JSON.stringify(history));
            displayHistory();
        }
        
        function getHistory() {
            const history = localStorage.getItem('orderHistory');
            return history ? JSON.parse(history) : [];
        }
        
        function displayHistory() {
            const history = getHistory();
            const historyList = document.getElementById('historyList');
            
            if (history.length === 0) {
                historyList.innerHTML = '<div style="color: #999; text-align: center; padding: 20px;">생성 기록이 없습니다.</div>';
                return;
            }
            
            historyList.innerHTML = history.map(item => `
                <div class="history-item">
                    <span class="time">${item.timestamp} | 자격증 ID: ${item.certId} | 유저 Public ID: ${item.userId}</span>
                    <span class="order-id" style="display: block; margin-bottom: 5px;">${item.orderNumber}</span>
                    ${item.buyerName ? `<span class="order-id" style="color: #667eea;">상품명: ${item.buyerName}</span>` : ''}
                    ${item.paymentAmount ? `<span class="order-id" style="color: #28a745; display: block; margin-top: 3px;">결제 금액: ${item.paymentAmount}</span>` : ''}
                </div>
            `).join('');
        }
        
        function clearHistory() {
            localStorage.removeItem('orderHistory');
            displayHistory();
        }
        
        // 페이지 로드 시 기록 표시
        displayHistory();
        
        // 기록 삭제 버튼 이벤트 연결
        const clearBtn = document.getElementById('clearHistoryBtn');
        if (clearBtn) {
            clearBtn.addEventListener('click', function(e) {
                clearHistory();
            });
        }
    </script>
</body>
</html>
